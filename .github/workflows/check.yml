name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: native/bin/StillnoteCapture --self-test
      - run: npm run test:native-scheduler
      - run: npm run test:e2e -- --no-build
      # The report is a debugging aid. If GitHub's artifact storage is down,
      # keep the run's result from the tests above.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: e2e-report
          path: output/e2e/
          if-no-files-found: ignore
